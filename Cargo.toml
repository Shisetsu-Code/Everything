[package]
name = "everything-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Responsive, persistent desktop file search in Rust"
repository = "https://github.com/Shisetsu-Code/Everything"
license = "MIT"
default-run = "everything-rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1"
directories = "6"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
egui_extras = { version = "0.37.0", default-features = false, optional = true }
notify = "8.2.2"
open = "5.4.5"
regex = "1"
rfd = { version = "0.18.0", optional = true }
rusqlite = { version = "0.42.0", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
trash = "5.3.0"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
