name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-rust-1.100
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and real filesystem integration tests
        run: cargo test --locked --all-features
      - name: Console-only build
        run: cargo check --locked --no-default-features --bin es
      - name: Release binaries
        run: cargo build --locked --release --bins
      - name: Verify portable Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installation)) {
            throw 'Visual Studio C++ tools were not found'
          }
          $toolset = Get-ChildItem (Join-Path ($installation.Trim()) 'VC\Tools\MSVC') -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $toolset) { throw 'An MSVC toolset was not found' }
          $dumpbin = Join-Path $toolset.FullName 'bin\Hostx64\x64\dumpbin.exe'
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin was not found at $dumpbin"
          }
          foreach ($binary in @('target/release/everything-rs.exe', 'target/release/es.exe')) {
            $dependencies = & $dumpbin /NOLOGO /DEPENDENTS $binary 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for ${binary}: $dependencies" }
            $dependencies | Write-Output
            $runtimeImports = @($dependencies | Where-Object {
              $_ -match '^\s*(?:VCRUNTIME|MSVCP|MSVCR|CONCRT)[0-9][^\\/\s]*\.dll\s*$'
            })
            if ($runtimeImports.Count -gt 0) {
              throw "Nonportable Visual C++ runtime imports in ${binary}: $($runtimeImports -join ', ')"
            }
          }
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke/files | Out-Null
          Set-Content -Path smoke/files/needle.txt -Value 'hello'
          ./target/release/es.exe --data-dir smoke/data --root smoke/files index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = ./target/release/es.exe --data-dir smoke/data search 'needle ext:txt' --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.total -ne 1) { throw 'Search smoke failed' }
          ./target/release/es.exe --data-dir smoke/data stats --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p smoke/files
          printf 'hello' > smoke/files/needle.txt
          ./target/release/es --data-dir smoke/data --root smoke/files index
          ./target/release/es --data-dir smoke/data search 'needle ext:txt' --json > smoke/result.json
          python3 -c 'import json; assert json.load(open("smoke/result.json"))["total"] == 1'
          ./target/release/es --data-dir smoke/data stats --check
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/everything-rs.exe,target/release/es.exe,README.md -Destination dist
          Copy-Item docs/SEARCH.md,docs/ARCHITECTURE.md -Destination dist
          Compress-Archive -Path dist/* -DestinationPath Everything-Rust-Windows-x64.zip
          Get-FileHash Everything-Rust-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Everything-Rust-Windows-x64.zip" } | Set-Content -Encoding ascii SHA256SUMS-Windows.txt
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/everything-rs target/release/es README.md docs/SEARCH.md docs/ARCHITECTURE.md dist/
          tar -czf Everything-Rust-Linux-x64.tar.gz -C dist .
          sha256sum Everything-Rust-Linux-x64.tar.gz > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Everything-Rust-${{ runner.os }}-x64
          path: |
            Everything-Rust-*.zip
            Everything-Rust-*.tar.gz
            SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          tag="build-${BUILD_NUMBER}-${BUILD_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          Aplicación de escritorio y CLI en Rust. Descargar el paquete de Windows, extraerlo y ejecutar everything-rs.exe. es.exe es la herramienta de consola.

          Incluye búsqueda avanzada, índice persistente, vigilancia de cambios, marcadores y exportación/importación EFU. Las pruebas y compilaciones de Windows y Linux pasaron para este commit.

          Esta versión usa recorrido de carpetas; no implementa el lector directo MFT/USN, servicio de Windows, servidores HTTP/ETP ni búsqueda de contenido de documentos de voidtools Everything. Los ejecutables no tienen firma Authenticode.
          NOTES
          gh release create "$tag" artifacts/* --repo "$REPOSITORY" --target "$COMMIT" --title "Everything Rust · build ${BUILD_NUMBER}" --notes-file release-notes.md --latest
