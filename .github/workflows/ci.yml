name: Diagnose Windows rescan cost
on:
  push:
    branches: [diagnose/windows-rescan]
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: Windows-rust-1.100
      - name: Check database rollback and identity
        run: cargo test --locked --no-default-features --test database
      - name: Build diagnostic console
        run: cargo build --locked --release --no-default-features --bin es
      - name: Compare checkpoint thresholds on identical seed databases
        run: python tools/profile-checkpoints.py --exe target/release/es.exe --output indexing-windows-checkpoint-control.json --files 100000 --timeout 300
      - name: Preserve diagnostic data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-checkpoint-control
          path: indexing-windows-checkpoint-control.json
          if-no-files-found: warn
          retention-days: 30
