name: Diagnose Windows rescan cost
on:
  push:
    branches: [diagnose/windows-rescan]
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: Windows-rust-1.100
      - name: Build diagnostic console
        run: cargo build --locked --release --no-default-features --bin es
      - name: Compare and profile actual indexing
        shell: pwsh
        run: |
          $baselineZip = Join-Path $env:RUNNER_TEMP 'everything-baseline-build-3-1.zip'
          $baselineDir = Join-Path $env:RUNNER_TEMP 'everything-baseline-build-3-1'
          Invoke-WebRequest -Uri 'https://github.com/Shisetsu-Code/Everything/releases/download/build-3-1/Everything-Rust-Windows-x64.zip' -OutFile $baselineZip -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $baselineZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a5c66a0a84f83825abe49186ce97b730ec4cad1975b4647a8adbfeb88e9b7e0f') { throw 'Baseline checksum mismatch' }
          Expand-Archive -LiteralPath $baselineZip -DestinationPath $baselineDir -Force
          ./tools/benchmark-indexing.ps1 -BaselineExe (Join-Path $baselineDir 'es.exe') -CandidateExe './target/release/es.exe' -OutputFile 'indexing-windows-profile.json' -Files 100000 -Repetitions 1
      - name: Preserve diagnostic data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-rescan-profile
          path: indexing-windows-profile.json
          if-no-files-found: warn
          retention-days: 30
